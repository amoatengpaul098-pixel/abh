<!doctype html>
<html>
    <head>
        <meta charset="utf-8">

        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header class="topbar">
            <a href="home.html">

            <h2>
                Wallet
            </h2>
            <a href="wallet-history.html">

        <main class="app">
            <section class="wallet">
                <small>
                    Available balance
                </small>

                <p>

                <div>
                    <button class="btn gold">

            <div class="wallet-actions">

                <a href="wallet-history.html">

                <div class="section-head">
                    <h2>

                    </h2>
                    <a href="wallet-history.html">

                    </a>

                <div class="transaction">
                    <span>
                        <b>

                    </span>

                        Today
                    </i>
                </div>
                <div class="transaction">
                    <span>
                        <b>
                            - GH₵450
                        </b>

                            Order payment
                        </small>
                    </span>

                        Yesterday
                    </i>
                </div>
                <div class="transaction">
                    <span>
                        <b>
                            + GH₵2,500

                    </span>

                        Oct 4
                    </i>
