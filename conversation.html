<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Conversation | ABH</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header class="topbar">
            <a href="chat.html">
                ←
            </a>
            <div class="chat-title">
                <div class="avatar green-bg">
                    RT
                </div>
                <span>
                    <b>
                        Royal Touch Fashion
                    </b>
                    <small>
                        Online
                    </small>
                </span>
            </div>
            <span>
                ☎
            </span>
        </header>
        <main class="conversation">
            <div class="bubble">
                Hello! 👋 Thanks for your interest.
            </div>
            <div class="bubble mine">
                Hi, I wanted to ask about the new collection.
            </div>
            <div class="bubble">
                Sure. We have several new designs available today.
            </div>
            <div class="bubble mine">
                Great, please send me the catalogue.
            </div>
            <div class="message-compose">
                <button>
                    ＋
                </button>
                <input placeholder="Message...">
                <button>
                    🎙
                </button>
            </div>
        </main>
    </body>
    </html>
